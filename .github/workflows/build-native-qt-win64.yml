name: build-native-qt-win64

on:
  push:
    branches: [feature/native-qt-panels]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build VLC Qt plugin in VideoLAN Win64 image
        run: |
          mkdir -p out
          docker run --rm \
            --user 0:0 \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            registry.videolan.org/vlc-debian-win64-3.0:20260820114402 \
            bash -lc '
              set -eux
              rm -rf vlc-build
              git clone --depth 1 --branch 3.0.24 https://github.com/videolan/vlc.git vlc-build
              cd vlc-build
              git apply --check ../vlc-patches/3.0.24/0001-xmeye-native-panels.patch
              git apply ../vlc-patches/3.0.24/0001-xmeye-native-panels.patch
              export VLC_PREBUILT_CONTRIBS_URL=https://artifacts.videolan.org/vlc-3.0/win64/vlc-contrib-x86_64-w64-mingw32-910cc9cada6080dd777fbafb2ebdd0c24f702c30.tar.zst
              echo "Using prebuilt contribs: $VLC_PREBUILT_CONTRIBS_URL"
              python3 ../ci/add_qt_preflight.py extras/package/win32/build.sh
              extras/package/win32/build.sh -a x86_64 -p
              QT_DLL=$(find . -type f -name libqt_plugin.dll | head -n 1)
              test -n "$QT_DLL"
              echo "Qt plugin: $QT_DLL"
              mv "$QT_DLL" /work/out/libqt_plugin.dll
            '

      - name: Record build metadata
        run: |
          sha256sum out/libqt_plugin.dll > out/SHA256SUMS.txt
          printf 'VLC base: 3.0.24\nPatch: XMEye native controls + interactive zoom\n' > out/BUILD-INFO.txt

      - name: Upload native Qt plugin
        uses: actions/upload-artifact@v4
        with:
          name: vlc-3.0.24-xmeye-native-qt-win64
          path: out/
